<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejemplo simple</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f0f4ff, #dfe9ff);
        color: #1f2937;
      }

      .card {
        background: white;
        padding: 2rem 2.5rem;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 2rem;
      }

      p {
        margin: 0 0 1.25rem;
        color: #4b5563;
      }

      button {
        border: none;
        border-radius: 999px;
        background: #2563eb;
        color: white;
        padding: 0.8rem 1.4rem;
        font-size: 1rem;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>¡Hola!</h1>
      <p>Este es un ejemplo sencillo en HTML.</p>
      <button>Presionar</button>
    </main>
  </body>
</html>
